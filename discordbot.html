<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DiscordBot - KSNeTeam</title>
    <link rel="stylesheet" href="css/main.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <header class="site-header">
        <button id="menu-toggle" class="menu-toggle" aria-label="メニュー">
            <span class="menu-icon"></span>
        </button>
        <h1 class="logo">KSNeTeam</h1>
        <nav id="main-nav">
            <ul class="nav-list">
                <li><a href="index.html" class="nav-link">Home</a></li>
                <li><a href="rules.html" class="nav-link">Rules</a></li>
                <li><a href="discordserver.html" class="nav-link">Discord</a></li>
                <li><a href="discordbot.html" class="nav-link">Bot</a></li>
                <li><a href="index.html#links" class="nav-link">Links</a></li>
            </ul>
        </nav>
    </header>
    
    <main>
        <section class="hero-section scroll-reveal">
            <div class="container">
                <h2 class="main-title">Discord Bot</h2>
                <div class="bot-features scroll-reveal">
                    <div class="feature-grid">
                        <div class="feature-item">
                            <h3>主な機能</h3>
                            <ul class="bot-features-list">
                                <li>メッセージ管理</li>
                                <li>ユーザー管理</li>
                                <li>音楽再生</li>
                                <li>イベント管理</li>
                            </ul>
                        </div>
                        <div class="feature-item">
                            <h3>使用方法</h3>
                            <p>スラッシュコマンド対応</p>
                            <ul class="bot-commands-list">
                                <li><code>/help</code> - コマンド一覧</li>
                                <li><code>/play</code> - 音楽再生</li>
                                <li><code>/event</code> - イベント作成</li>
                            </ul>
                        </div>
                    </div>
                    <div class="bot-info">
                        <p>このBotは当サーバー専用のプライベートBotです</p>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <div class="container">
            <p>&copy; 2025 KSNeTeam. All rights reserved.</p>
        </div>
    </footer>

    <script src="js/main.js"></script>
</body>
</html>
